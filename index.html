<!doctype html>
<html lang="en" data-scheme="light" data-table="calm" data-back="blue" data-size="large" data-zoom="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KittyCat Solitaire</title>
  <meta name="description" content="A quiet solitaire that tells you when you make a lazy move.">
  <meta name="theme-color" content="#A8C3B0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KittyCat">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Game menu" aria-haspopup="true"></button>
      <button class="icon-btn" id="undoBtn" aria-label="Undo" disabled></button>
      <button class="btn primary" id="finishBtn" hidden>Finish</button>
      <span class="spacer"></span>
      <div id="status" aria-live="polite"></div>
    </header>
    <main id="boardWrap"><div id="board" class="board"></div></main>
  </div>
  <div id="menu" hidden role="menu"></div>
  <div id="banner" hidden></div>
  <div id="overlay" hidden></div>
  <div id="toast" hidden></div>
  <dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
  <noscript>KittyCat Solitaire needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
